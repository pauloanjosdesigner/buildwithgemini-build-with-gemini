<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Guide for Designers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-light: #e0e7ff;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --user-bubble: #6366f1;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  }
  body.dark-canvas {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-light: #312e81;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background 0.25s ease, color 0.25s ease;
  }
  header {
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    color: #ffffff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 0.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-title {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  .header-subtitle {
    font-size: 0.8rem;
    opacity: 0.85;
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .header-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .header-toggle-btn {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff;
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: background 0.2s ease;
  }
  .header-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    animation: fadeInUp 0.25s ease-out forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }
  .msg-meta {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .bubble {
    display: inline-block;
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    max-width: 85%;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    box-shadow: none;
    white-space: normal;
  }

  /* Color Swatch Pills */
  .color-swatch-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.15rem 0.5rem;
    background: rgba(99, 102, 241, 0.08);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    font-size: 0.85em;
    vertical-align: middle;
    margin: 0 0.15rem;
  }
  body.dark-canvas .color-swatch-pill {
    background: rgba(255, 255, 255, 0.08);
  }
  .color-swatch-box {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.25);
    display: inline-block;
    flex-shrink: 0;
  }

  .examples {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .example-btn {
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 0.825rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .example-btn:hover {
    background: var(--accent-light);
    color: var(--accent-hover);
    border-color: var(--accent);
  }
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.5rem 1.25rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
    color: var(--text-primary);
  }
  input:focus {
    background: var(--card-bg);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  button.send-btn {
    padding: 0.8rem 1.3rem;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button.send-btn:hover {
    background: var(--accent-hover);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <div class="header-icon">
      <span class="material-symbols-outlined" style="color: #ffffff; font-size: 1.5rem;">palette</span>
    </div>
    <div>
      <div class="header-title">Color Guide for Designers</div>
      <div class="header-subtitle">AI-Powered UI/UX Color Assistant</div>
    </div>
  </div>
  <div class="header-actions">
    <button type="button" id="theme-toggle" class="header-toggle-btn">
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #ffffff;">dark_mode</span>
      <span id="theme-label">Dark Canvas</span>
    </button>
    <div class="header-badge">A2A Ready</div>
  </div>
</header>

<div id="log"></div>

<div class="examples" id="examples">
  <button type="button" class="example-btn" data-prompt="Generate a dark mode UI color palette with electric blue accents">🎨 Dark Mode Palette</button>
  <button type="button" class="example-btn" data-prompt="Check contrast between #1e293b text and #ffffff background">♿ WCAG Contrast Check</button>
  <button type="button" class="example-btn" data-prompt="Generate a preview image of a sleek dashboard palette card">🖼️ Preview Swatch Card</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask about color palettes, contrast compliance, or visual mockups…" autocomplete="off" autofocus>
  <button type="submit" class="send-btn">
    Send
    <span class="material-symbols-outlined" style="color: #ffffff; font-size: 1.1rem;">send</span>
  </button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const themeToggle = document.getElementById("theme-toggle");
const themeLabel = document.getElementById("theme-label");

if (themeToggle) {
  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-canvas");
    const isDark = document.body.classList.contains("dark-canvas");
    if (themeLabel) themeLabel.textContent = isDark ? "Light Canvas" : "Dark Canvas";
    const icon = themeToggle.querySelector(".material-symbols-outlined");
    if (icon) icon.textContent = isDark ? "light_mode" : "dark_mode";
  });
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const meta = el("div", "msg-meta", who === "user" ? "👤 You" : "🎨 Color Guide");
  const b = el("div", "bubble");
  m.appendChild(meta);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function renderTextWithSwatches(container, textStr) {
  container.innerHTML = "";
  const regex = /#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g;
  let lastIndex = 0;
  let match;
  while ((match = regex.exec(textStr)) !== null) {
    if (match.index > lastIndex) {
      container.appendChild(document.createTextNode(textStr.substring(lastIndex, match.index)));
    }
    const hex = match[0];
    const pill = el("span", "color-swatch-pill");
    const box = el("span", "color-swatch-box");
    box.style.backgroundColor = hex;
    pill.appendChild(box);
    pill.appendChild(document.createTextNode(hex));
    container.appendChild(pill);
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < textStr.length) {
    container.appendChild(document.createTextNode(textStr.substring(lastIndex)));
  }
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      renderTextWithSwatches(t, boundStr(props.text));
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textNodeDiv = el("div");
    renderTextWithSwatches(textNodeDiv, textStr);
    b.appendChild(textNodeDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const flatDiv = el("div");
      renderTextWithSwatches(flatDiv, flattenText(a2ui) || "(no card content)");
      b.appendChild(flatDiv);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  const userB = bubble("user");
  renderTextWithSwatches(userB, text);
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".example-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.getAttribute("data-prompt") || "";
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  });
});
</script>
</body>
</html>
